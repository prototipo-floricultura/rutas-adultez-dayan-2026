t-size:12px}.answer.correct{background:#dcebdc;border:2px solid #3c7957;padding:16px 18px}.answer.incorrect{background:#f9e4da;border:2px solid #b8583c;padding:16px 18px}.answer.correct .letter{background:var(--green);color:white;border-color:var(--green)}.answer.incorrect .letter{background:var(--coral);color:white;border-color:var(--coral)}.answer:disabled{opacity:1}.feedback{margin-top:22px;border-left:4px solid var(--green);padding:18px 21px;background:#edf2e5;border-radius:0 12px 12px 0;font-size:14px;line-height:1.65}.feedback.no{border-color:var(--coral);background:#fcf0e8}.feedback strong{display:block;margin-bottom:6px}.feedback .cite{font-size:11px;display:block;margin-top:10px;color:var(--muted)}.question-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:15px}.question-bottom small{font-size:11px;max-width:480px;color:var(--muted)}.start{background:var(--white);border:1px solid var(--line);border-radius:25px;padding:38px;display:grid;grid-template-columns:1fr 270px;gap:30px;align-items:center}.start p{margin:20px 0;color:var(--muted)}.start ol{padding-left:22px;font-size:14px;margin-bottom:25px}.start li{margin:10px 0}.start-art svg{width:100%;height:auto}.results{background:var(--white);border-radius:26px;border:1px solid var(--line);padding:40px;display:grid;grid-template-columns:1fr 260px;gap:25px}.results .large{font-family:Georgia,serif;font-size:80px;line-height:1.2}.results p{color:var(--muted);margin-top:20px}.result-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.insights{display:grid;gap:13px;margin-top:25px}.insight{padding:17px;background:var(--paper);border-radius:15px;font-size:14px}.review{margin-top:28px;display:grid;gap:12px}.review details{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:17px 20px;font-size:14px}.review summary{cursor:pointer;font-weight:bold}.review p{margin-top:13px;line-height:1.6}.review .citation{font-size:12px;color:var(--muted)}dia <script id="content-data" type="application/json">{"juegos":[{"id":"fisico_sexual","titulo":"Decisiones que cuidan: desarrollo físico y sexual en la adultez","subtitulo":"Doce situaciones para reconocer cambios, derechos y formas de cuidado sin estereotipos","narrativa":{"inicio":"Acompaña a varias personas adultas en decisiones cotidianas sobre movimiento, cambios corporales, intimidad y salud sexual. En cada estación conviene diferenciar un cambio posible del curso de vida, un estereotipo y una situación que merece orientación profesional.","instrucciones":"Lee cada reto, elige una opción y revisa la explicación. Solo hay una respuesta correcta por estación. Cada acierto suma 10 puntos.","cierre":"Cuidar el cuerpo y la sexualidad en la adultez exige información confiable, consentimiento, comunicación y decisiones adaptadas a cada persona. La edad no cancela el derecho al bienestar, al placer ni a una atención respetuosa."},"retos":[{"id":"FS01","tipo":"seleccion_simple","titulo":"Bienestar, no solo ausencia de enfermedad","pregunta":"¿Cuál definición representa mejor la salud sexual en la adultez?","opciones":[{"id":"A","texto":"Un estado de bienestar físico, emocional, mental y social relacionado con la sexualidad, basado en respeto y seguridad.","correcta":true,"feedback":"Correcto. La salud sexual incluye bienestar, relaciones respetuosas y experiencias seguras y libres de coerción; no se limita a evitar enfermedades."},{"id":"B","texto":"La ausencia de infecciones, aunque exista presión, discriminación o malestar en la relación.","correcta":false,"feedback":"No es suficiente. La ausencia de una infección no garantiza salud sexual si faltan consentimiento, respeto, seguridad o bienestar emocional."},{"id":"C","texto":"La capacidad reproductiva de una persona durante una etapa determinada de su vida.","correcta":false,"feedback":"Esa definición es demasiado reducida. La sexualidad y la salud sexual abarcan intimidad, placer, identidad, vínculos y derechos durante todo el curso de vida."}],"concepto":"Salud sexual integral y enfoque de derechos","explicacion":"La salud sexual se comprende de manera positiva e integral: requiere acceso a información y atención, respeto por los derechos y posibilidad de vivir la sexualidad sin coerción, discriminación ni violencia.","fuentes":["S01"],"cita_corta":"(World Health Organization [WHO], s. f.)"},{"id":"FS02","tipo":"mito_realidad","titulo":"¿La sexualidad tiene fecha de vencimiento?","pregunta":"Afirmación: «Al llegar a la adultez media, la sexualidad pierde importancia y debe desaparecer». ¿Cómo se clasifica?","opciones":[{"id":"A","texto":"Mito","correcta":true,"feedback":"Correcto. La sexualidad es una dimensión humana presente a lo largo de la vida; su significado y sus expresiones pueden cambiar, pero no desaparecen por cumplir cierta edad."},{"id":"B","texto":"Realidad","correcta":false,"feedback":"No. Presentar la sexualidad como exclusiva de la juventud reproduce un estereotipo edadista y desconoce la diversidad de experiencias adultas."},{"id":"C","texto":"Regla clínica para todas las personas","correcta":false,"feedback":"No existe una regla clínica que ordene abandonar la sexualidad por la edad. Algunas personas desean actividad sexual, otras priorizan otras formas de intimidad y otras no la buscan; todas esas posibilidades merecen respeto."}],"concepto":"Sexualidad durante el curso de vida","explicacion":"La OMS señala que la sexualidad es un aspecto central del ser humano a lo largo de la vida. Su vivencia depende de factores biológicos, psicológicos, relacionales, sociales y culturales.","fuentes":["S01","S02"],"cita_corta":"(WHO, s. f.; National Institute on Aging [NIA], s. f.)"},{"id":"FS03","tipo":"decision_escenario","titulo":"Cambios durante la transición menopáusica","pregunta":"Escenario educativo ficticio: Elena, de 49 años, nota irregularidad menstrual, sofocos y dificultad para dormir. Los síntomas afectan su trabajo y su descanso. ¿Qué decisión es más adecuada?","opciones":[{"id":"A","texto":"Buscar información confiable y consultar a un profesional de salud para valorar sus síntomas, antecedentes y preferencias.","correcta":true,"feedback":"Correcto. La experiencia de la perimenopausia varía entre personas; cuando afecta el bienestar conviene recibir valoración y conocer opciones individualizadas."},{"id":"B","texto":"Asumir que debe soportarlo porque cualquier malestar es inevitable a esa edad.","correcta":false,"feedback":"No. La menopausia es una etapa del curso de vida, pero los síntomas que alteran la calidad de vida pueden y deben conversarse con personal de salud."},{"id":"C","texto":"Iniciar por cuenta propia un tratamiento recomendado a otra persona.","correcta":false,"feedback":"No es seguro. Las opciones de manejo dependen de la historia clínica, los valores y las preferencias de cada persona; una recomendación ajena no sustituye la evaluación individual."}],"concepto":"Perimenopausia, diversidad de síntomas y atención individualizada","explicacion":"La transición menopáusica puede incluir cambios menstruales, sofocos, alteraciones del sueño y cambios emocionales o sexuales. Su intensidad es variable y los síntomas que afectan la vida diaria merecen orientación profesional.","fuentes":["S03"],"cita_corta":"(WHO, 2024)"},{"id":"FS04","tipo":"mito_realidad","titulo":"Un mismo cambio para todas las personas","pregunta":"Afirmación: «Todas las personas adultas presentan los mismos cambios físicos y sexuales a la misma edad». ¿Cómo se clasifica?","opciones":[{"id":"A","texto":"Mito","correcta":true,"feedback":"Correcto. Existen tendencias generales, pero el ritmo y la experiencia de los cambios dependen de salud, historia de vida, contexto, relaciones, medicamentos y otros factores."},{"id":"B","texto":"Realidad","correcta":false,"feedback":"No. Convertir la edad cronológica en un destino uniforme borra la diversidad del desarrollo adulto y puede llevar a normalizar problemas que requieren atención."},{"id":"C","texto":"Realidad solo después de los 50 años","correcta":false,"feedback":"Tampoco. No hay una edad en la que todas las personas pasen a tener una experiencia corporal o sexual idéntica."}],"concepto":"Variabilidad y multidimensionalidad del desarrollo adulto","explicacion":"El desarrollo físico y sexual no sigue una trayectoria idéntica. La evidencia sobre la adultez media destaca variabilidad, plasticidad e interacción entre condiciones biológicas, psicológicas y sociales.","fuentes":["S06","S10"],"cita_corta":"(Carabalí C., 2020; Lachman et al., 2015)"},{"id":"FS05","tipo":"decision_escenario","titulo":"Cambios persistentes en la respuesta sexual","pregunta":"Escenario educativo ficticio: Andrés, de 54 años, presenta dificultades de erección de forma frecuente. Se siente avergonzado y piensa comprar un suplemento anunciado en internet. ¿Qué opción protege mejor su salud?","opciones":[{"id":"A","texto":"Hablar con un profesional de salud, revisar posibles factores físicos, emocionales y farmacológicos, y evitar automedicarse.","correcta":true,"feedback":"Correcto. Un cambio frecuente puede relacionarse con distintos factores y, en ocasiones, ser señal de otra condición; la valoración permite orientar opciones seguras."},{"id":"B","texto":"Comprar el suplemento porque los productos naturales no interactúan con medicamentos.","correcta":false,"feedback":"No. Los suplementos pueden causar efectos adversos o interactuar con medicamentos; una publicidad no reemplaza la evaluación profesional."},{"id":"C","texto":"Callar el tema porque la dificultad siempre es inevitable con la edad.","correcta":false,"feedback":"No. La edad puede acompañarse de cambios, pero una dificultad frecuente no debe descartarse como algo inevitable; conversar permite identificar causas y alternativas."}],"concepto":"Respuesta sexual, salud integral y consulta oportuna","explicacion":"La función sexual puede verse influida por enfermedades, medicamentos, estrés, depresión, dolor y factores relacionales. La recomendación educativa es buscar una evaluación individualizada, no prescribir ni automedicarse.","fuentes":["S02"],"cita_corta":"(NIA, s. f.)"},{"id":"FS06","tipo":"seleccion_simple","titulo":"Moverse aporta más que controlar el peso","pregunta":"¿Cuál afirmación describe mejor el valor de la actividad física durante la adultez?","opciones":[{"id":"A","texto":"Puede beneficiar la salud cardiovascular, muscular, mental, cognitiva y el sueño, además de reducir riesgos asociados al sedentarismo.","correcta":true,"feedback":"Correcto. La actividad física ofrece beneficios en varios sistemas y no debe reducirse a una meta estética o de peso."},{"id":"B","texto":"Solo tiene utilidad cuando produce una pérdida rápida de peso.","correcta":false,"feedback":"No. Incluso sin una pérdida rápida de peso, el movimiento regular puede aportar beneficios físicos y mentales."},{"id":"C","texto":"Deja de ser beneficiosa si no se practica como deporte competitivo.","correcta":false,"feedback":"No. Caminar, desplazarse activamente, bailar, hacer tareas domésticas o realizar ejercicios adaptados también cuentan como actividad física."}],"concepto":"Actividad física y salud multidimensional","explicacion":"Las guías de la OMS relacionan la actividad física regular con beneficios cardiovasculares, metabólicos, mentales, cognitivos y del sueño. También reconocen múltiples formas cotidianas de movimiento.","fuentes":["S04"],"cita_corta":"(WHO, 2020)"},{"id":"FS07","tipo":"decision_escenario","titulo":"Empezar de manera sostenible","pregunta":"Escenario educativo ficticio: Luisa, de 46 años, lleva meses con poca actividad y quiere retomar el movimiento. ¿Cuál plan inicial es más sensato?","opciones":[{"id":"A","texto":"Comenzar con cantidades pequeñas, aumentar gradualmente y adaptar la intensidad a su capacidad y condiciones de salud.","correcta":true,"feedback":"Correcto. La OMS aconseja que las personas inactivas empiecen de forma gradual; hacer algo de actividad ya aporta beneficios y favorece la continuidad."},{"id":"B","texto":"Iniciar de inmediato con sesiones extenuantes todos los días para recuperar el tiempo perdido.","correcta":false,"feedback":"No. Un aumento brusco puede dificultar la adherencia y no considera la capacidad actual ni posibles contraindicaciones."},{"id":"C","texto":"Esperar hasta poder cumplir el máximo de minutos recomendado; antes de eso moverse no sirve.","correcta":false,"feedback":"No. Las guías aclaran que hacer algo de actividad es mejor que no hacer ninguna; el progreso puede construirse paso a paso."}],"concepto":"Progresión gradual y adaptación de la actividad física","explicacion":"La recomendación poblacional para adultos es acumular actividad aeróbica semanal y fortalecimiento muscular, pero el inicio debe ajustarse a la capacidad individual y aumentar gradualmente. No se formula aquí una prescripción personal.","fuentes":["S04"],"cita_corta":"(WHO, 2020)"},{"id":"FS08","tipo":"mito_realidad","titulo":"La prevención también continúa","pregunta":"Afirmación: «Después de la menopausia o al llegar a una edad avanzada ya no existe riesgo de infecciones de transmisión sexual». ¿Cómo se clasifica?","opciones":[{"id":"A","texto":"Mito","correcta":true,"feedback":"Correcto. La edad y la menopausia no eliminan el riesgo de infecciones de transmisión sexual; las medidas de prevención dependen de las prácticas y de la situación de cada persona."},{"id":"B","texto":"Realidad","correcta":false,"feedback":"No. Las personas sexualmente activas pueden adquirir infecciones a cualquier edad; asumir lo contrario puede disminuir la prevención y la consulta."},{"id":"C","texto":"Realidad si ya no hay posibilidad de embarazo","correcta":false,"feedback":"No. La posibilidad de embarazo y el riesgo de infecciones son asuntos distintos; que cambie la fertilidad no elimina la necesidad de prevención frente a infecciones."}],"concepto":"Prevención de infecciones durante el curso de vida","explicacion":"La prevención sexual no termina con la capacidad reproductiva. La OMS y el NIA advierten que las infecciones de transmisión sexual pueden afectar a personas adultas y mayores.","fuentes":["S02","S03"],"cita_corta":"(NIA, s. f.; WHO, 2024)"},{"id":"FS09","tipo":"decision_escenario","titulo":"Intimidad con comunicación y consentimiento","pregunta":"Escenario educativo ficticio: Patricia y Julián perciben diferencias recientes en su deseo sexual. Ambos quieren cuidar la relación. ¿Cuál respuesta es más constructiva?","opciones":[{"id":"A","texto":"Conversar sin culpas sobre necesidades y límites, respetar el consentimiento y explorar formas de intimidad satisfactorias para ambos.","correcta":true,"feedback":"Correcto. La comunicación respetuosa permite comprender cambios, negociar límites y reconocer que la intimidad puede expresarse de distintas maneras."},{"id":"B","texto":"Presionar a quien tiene menor deseo para que cumpla con una frecuencia considerada normal.","correcta":false,"feedback":"No. No existe una frecuencia universal y la presión vulnera el consentimiento; el bienestar sexual requiere decisiones libres y respetuosas."},{"id":"C","texto":"Evitar toda conversación y asumir que la diferencia significa falta de amor.","correcta":false,"feedback":"No. El deseo puede estar influido por salud, emociones, estrés, medicamentos y contexto. Suponer una causa sin hablar puede aumentar el malestar."}],"concepto":"Comunicación, consentimiento y diversidad de la intimidad","explicacion":"La salud sexual supone respeto y libertad de coerción. La intimidad puede incluir cercanía emocional y contacto físico sexual o no sexual, de acuerdo con los deseos y límites de cada persona.","fuentes":["S01","S02"],"cita_corta":"(NIA, s. f.; WHO, s. f.)"},{"id":"FS10","tipo":"seleccion_simple","titulo":"Intimidad y sexualidad no son idénticas","pregunta":"¿Qué opción diferencia mejor intimidad y sexualidad?","opciones":[{"id":"A","texto":"La intimidad es cercanía y conexión, con o sin componente físico; la sexualidad incluye deseos, expresiones, identidad y prácticas diversas.","correcta":true,"feedback":"Correcto. Una persona puede valorar intimidad sin actividad sexual, sexualidad sin pareja o ambas dimensiones; no hay una única forma válida."},{"id":"B","texto":"Son exactamente lo mismo y siempre requieren penetración.","correcta":false,"feedback":"No. Esa definición limita indebidamente ambas experiencias y desconoce múltiples formas de cercanía y expresión sexual."},{"id":"C","texto":"La intimidad solo existe en parejas casadas y la sexualidad solo durante los años reproductivos.","correcta":false,"feedback":"No. La cercanía y la sexualidad no dependen del estado civil ni terminan con la etapa reproductiva."}],"concepto":"Diversidad de vínculos y expresiones","explicacion":"Distinguir intimidad y sexualidad evita imponer un único modelo de relación. La autonomía y la diversidad son compatibles con una mirada de curso de vida.","fuentes":["S01","S02"],"cita_corta":"(NIA, s. f.; WHO, s. f.)"},{"id":"FS11","tipo":"mito_realidad","titulo":"La edad no invalida una consulta","pregunta":"Afirmación: «Si una persona mayor consulta por dolor o por un cambio sexual, es adecuado responder que es normal por la edad sin hacer una valoración individual». ¿Cómo se clasifica?","opciones":[{"id":"A","texto":"Mito","correcta":true,"feedback":"Correcto. Reducir una preocupación a la edad puede ser edadista y dejar sin evaluar dolor, efectos de medicamentos, enfermedades u otras causas tratables."},{"id":"B","texto":"Realidad","correcta":false,"feedback":"No. Aunque algunos cambios sean más frecuentes con la edad, la atención debe escuchar, explorar el contexto y valorar cada caso."},{"id":"C","texto":"Realidad cuando la persona tiene más de 65 años","correcta":false,"feedback":"Tampoco. Cumplir una edad no elimina el derecho a una atención respetuosa e individualizada ni convierte todo malestar en inevitable."}],"concepto":"Edadismo y atención individualizada","explicacion":"Los estereotipos sobre la vejez pueden producir discriminación y ocultar la diversidad de trayectorias. Una consulta de salud sexual merece escucha y valoración sin prejuicios.","fuentes":["S02","S09"],"cita_corta":"(Amezcua & García Domingo, 2022; NIA, s. f.)"},{"id":"FS12","tipo":"seleccion_simple","titulo":"Una experiencia influida por varios factores","pregunta":"¿Cuál conjunto de factores puede influir en el deseo y la respuesta sexual durante la adultez?","opciones":[{"id":"A","texto":"Estado físico y emocional, relaciones, contexto social, medicamentos, enfermedades, valores y experiencias personales.","correcta":true,"feedback":"Correcto. La sexualidad resulta de la interacción de dimensiones biológicas, psicológicas, relacionales, sociales y culturales."},{"id":"B","texto":"Únicamente la edad cronológica.","correcta":false,"feedback":"No. La edad por sí sola no explica la diversidad de experiencias ni permite identificar la causa de un cambio."},{"id":"C","texto":"Solo el nivel de hormonas, sin influencia de emociones o relaciones.","correcta":false,"feedback":"No. Los aspectos hormonales pueden intervenir, pero no actúan aislados de la salud general, las emociones, los vínculos y el contexto."}],"concepto":"Modelo biopsicosocial de la sexualidad","explicacion":"Una comprensión integral evita explicaciones únicas y permite reconocer tanto cambios esperables como necesidades de apoyo o atención profesional.","fuentes":["S01","S02"],"cita_corta":"(NIA, s. f.; WHO, s. f.)"}]},{"id":"crisis_mediana_edad","titulo":"La brújula de la mediana edad: cambios sin etiquetas","subtitulo":"Doce retos para distinguir transición, malestar y posibilidades de desarrollo","narrativa":{"inicio":"En la mediana edad pueden coincidir responsabilidades, pérdidas, logros y cambios corporales o familiares. Recorre doce escenas y decide cuándo hay una transición, cuándo aparece un estereotipo y cuándo conviene solicitar apoyo.","instrucciones":"Selecciona la respuesta mejor sustentada. Solo una opción es correcta y cada acierto suma 10 puntos. La meta no es diagnosticar, sino interpretar cada situación con cuidado.","cierre":"La mediana edad no tiene un guion único. Puede reunir tensiones y oportunidades, y su significado depende de la historia, los vínculos, los recursos y el contexto de cada persona."},"retos":[{"id":"MC01","tipo":"mito_realidad","titulo":"¿Una crisis inevitable?","pregunta":"Afirmación: «Todas las personas atraviesan una crisis de la mediana edad». ¿Cómo se clasifica?","opciones":[{"id":"A","texto":"Mito","correcta":true,"feedback":"Correcto. La investigación no respalda una crisis universal; muchas personas viven la mediana edad como una etapa estable o con retos que no constituyen una crisis."},{"id":"B","texto":"Realidad","correcta":false,"feedback":"No. Convertir la crisis en regla confunde una posibilidad con un destino y puede ocultar otras causas de malestar físico o psicológico."},{"id":"C","texto":"Realidad para toda persona entre 40 y 60 años","correcta":false,"feedback":"Tampoco. La edad aproximada no determina por sí sola una crisis; las trayectorias y los contextos son diversos."}],"concepto":"Crisis no normativa ni universal","explicacion":"La expresión «crisis de la mediana edad» es una narrativa popular, pero no describe a la mayoría como una experiencia inevitable. Las investigaciones recientes insisten en la diversidad de trayectorias.","fuentes":["S05","S06"],"cita_corta":"(Infurna et al., 2020; Lachman et al., 2015)"},{"id":"MC02","tipo":"seleccion_simple","titulo":"Más que una cifra en el documento","pregunta":"¿Qué criterio ayuda más a comprender la mediana edad?","opciones":[{"id":"A","texto":"La combinación de roles, transiciones, acontecimientos y contexto histórico, además de una edad aproximada.","correcta":true,"feedback":"Correcto. Los límites cronológicos son orientativos; las responsabilidades, los eventos y las condiciones sociales explican mejor la experiencia de cada persona."},{"id":"B","texto":"Una edad exacta y universal en la que comienza la crisis.","correcta":false,"feedback":"No. No existe una edad exacta que active una crisis igual para todas las personas."},{"id":"C","texto":"El aspecto físico, sin considerar relaciones, trabajo o cultura.","correcta":false,"feedback":"No. La mediana edad se vive dentro de redes familiares, laborales, culturales y económicas que también influyen en su significado."}],"concepto":"Mediana edad como periodo contextual","explicacion":"La literatura suele ubicarla aproximadamente entre los 40 y 60 años, con márgenes variables, pero considera más informativos los roles y el momento de los acontecimientos vitales.","fuentes":["S05","S06"],"cita_corta":"(Infurna et al., 2020; Lachman et al., 2015)"},{"id":"MC03","tipo":"decision_escenario","titulo":"Muchos cambios no equivalen a una crisis","pregunta":"Escenario educativo ficticio: Marcela, de 47 años, cambia de empleo y empieza a acompañar a su padre en varias citas médicas. Está cansada, pero conserva sus actividades y su red de apoyo. ¿Cuál interpretación es más prudente?","opciones":[{"id":"A","texto":"Vive transiciones y una carga de roles que conviene organizar; no hay base suficiente para etiquetarla automáticamente como crisis.","correcta":true,"feedback":"Correcto. El cansancio en un periodo exigente merece atención y apoyo, pero una transición no se convierte en crisis solo por ocurrir en la mediana edad."},{"id":"B","texto":"Tiene una crisis de la mediana edad porque cambió de empleo después de los 40.","correcta":false,"feedback":"No. Un cambio laboral puede ser reto, oportunidad o ambas cosas; la edad y el evento aislado no bastan para definir una crisis."},{"id":"C","texto":"No necesita cuidar su descanso porque acompañar a la familia siempre debe hacerse sin límites.","correcta":false,"feedback":"No. Las responsabilidades de cuidado pueden generar sobrecarga; organizar apoyos y proteger el bienestar también forman parte del cuidado."}],"concepto":"Transiciones, roles múltiples y evaluación contextual","explicacion":"En la mediana edad pueden coincidir trabajo, apoyo a generaciones jóvenes y cuidado de familiares mayores. Estas demandas deben analizarse por su intensidad y recursos disponibles, no mediante una etiqueta automática.","fuentes":["S05","S06"],"cita_corta":"(Infurna et al., 2020; Lachman et al., 2015)"},{"id":"MC04","tipo":"seleccion_simple","titulo":"Ganancias y pérdidas pueden coexistir","pregunta":"¿Cuál afirmación representa mejor el desarrollo en la mediana edad?","opciones":[{"id":"A","texto":"Puede combinar ganancias, estabilidad y pérdidas en distintos ámbitos, con posibilidades de adaptación y cambio.","correcta":true,"feedback":"Correcto. El desarrollo adulto es multidireccional: una persona puede ganar experiencia o regulación emocional mientras enfrenta cambios físicos o nuevas responsabilidades."},{"id":"B","texto":"Después de cierta edad todas las capacidades disminuyen al mismo tiempo.","correcta":false,"feedback":"No. Esa visión lineal desconoce la variabilidad y las posibles ganancias, compensaciones y aprendizajes de la adultez."},{"id":"C","texto":"Si hay logros laborales, no puede existir ningún malestar personal.","correcta":false,"feedback":"No. Los ámbitos de la vida pueden seguir trayectorias distintas; un logro no elimina automáticamente las tensiones presentes en otros espacios."}],"concepto":"Multidireccionalidad, variabilidad y plasticidad","explicacion":"La mediana edad puede ser una encrucijada de crecimiento y declive. La presencia de una pérdida no define toda la etapa, del mismo modo que un logro no borra las dificultades.","fuentes":["S06","S10"],"cita_corta":"(Carabalí C., 2020; Lachman et al., 2015)"},{"id":"MC05","tipo":"mito_realidad","titulo":"El estereotipo de las decisiones impulsivas","pregunta":"Afirmación: «Comprar algo costoso, cambiar de apariencia o terminar una relación después de los 40 demuestra por sí solo una crisis de la mediana edad». ¿Cómo se clasifica?","opciones":[{"id":"A","texto":"Mito","correcta":true,"feedback":"Correcto. Una conducta aislada no permite inferir una crisis; es necesario comprender motivos, consecuencias, duración, funcionamiento y contexto."},{"id":"B","texto":"Realidad","correcta":false,"feedback":"No. Esa asociación proviene de imágenes estereotipadas y puede convertir cualquier decisión adulta en señal de crisis."},{"id":"C","texto":"Realidad si la decisión sorprende a la familia","correcta":false,"feedback":"Tampoco. La sorpresa de otras personas no sustituye una comprensión cuidadosa de los motivos y efectos de la decisión."}],"concepto":"Estereotipos y atribución precipitada","explicacion":"La narrativa popular suele representar la crisis mediante cambios abruptos de consumo, pareja o apariencia. La evidencia no permite usar esos actos como diagnóstico ni como criterio universal.","fuentes":["S05"],"cita_corta":"(Infurna et al., 2020)"},{"id":"MC06","tipo":"decision_escenario","titulo":"Dar lugar a las pérdidas","pregunta":"Escenario educativo ficticio: Óscar, de 52 años, se jubila antes de lo previsto y siente tristeza por perder rutinas y vínculos laborales. ¿Qué respuesta favorece una elaboración saludable?","opciones":[{"id":"A","texto":"Reconocer la pérdida, conversar sobre su significado y construir gradualmente nuevas rutinas y apoyos.","correcta":true,"feedback":"Correcto. Elaborar una pérdida requiere tiempo y puede abrir nuevas formas de organización; negarla o responder impulsivamente no garantiza adaptación."},{"id":"B","texto":"Negar la tristeza porque sentirse afectado demuestra debilidad.","correcta":false,"feedback":"No. La tristeza puede ser una respuesta comprensible ante una pérdida; invalidarla dificulta reconocer necesidades y buscar apoyo."},{"id":"C","texto":"Tomar una decisión irreversible de inmediato para dejar de sentir malestar.","correcta":false,"feedback":"No. Actuar con urgencia puede impedir valorar consecuencias. Es preferible dar tiempo a la elaboración y solicitar ayuda si el malestar se intensifica."}],"concepto":"Duelo, elaboración y transición","explicacion":"Desde la perspectiva psicoanalítica revisada por Saavedra y colaboradores, una crisis puede vivirse como obstáculo y posibilidad; la elaboración de pérdidas ayuda a evitar respuestas dominadas por la urgencia.","fuentes":["S07"],"cita_corta":"(Saavedra et al., 2022)"},{"id":"MC07","tipo":"seleccion_simple","titulo":"Generatividad más allá de la crianza","pregunta":"¿Qué ejemplo expresa mejor la generatividad en la adultez?","opciones":[{"id":"A","texto":"Orientar a personas más jóvenes, cuidar, crear, enseñar o participar en iniciativas que aporten al bien común.","correcta":true,"feedback":"Correcto. La generatividad se expresa de múltiples formas y tiene como núcleo el cuidado de otras personas, ideas, productos o instituciones."},{"id":"B","texto":"Tener hijos biológicos como única forma válida de dejar un legado.","correcta":false,"feedback":"No. La crianza puede ser generativa, pero no es la única vía; también lo son la mentoría, el trabajo creativo, el cuidado y la participación comunitaria."},{"id":"C","texto":"Conservar todo conocimiento para evitar que otras personas lo utilicen.","correcta":false,"feedback":"No. La generatividad implica contribuir, cuidar y favorecer la continuidad o el desarrollo de otras personas y de la comunidad."}],"concepto":"Generatividad y legado","explicacion":"La generatividad atraviesa roles y actividades adultas. Puede aparecer en la familia, el trabajo, el arte, la educación, el voluntariado y la vida cívica.","fuentes":["S05","S08"],"cita_corta":"(Infurna et al., 2020; Moreno et al., 2022)"},{"id":"MC08","tipo":"decision_escenario","titulo":"Un legado construido en comunidad","pregunta":"Escenario educativo ficticio: Camilo, de 50 años, no tiene hijos y acompaña a aprendices de su oficio; además, participa en una huerta barrial. Alguien le dice que no puede ser generativo. ¿Cuál respuesta es correcta?","opciones":[{"id":"A","texto":"Sus acciones pueden ser generativas porque transmiten saberes, cuidan vínculos y aportan a otras generaciones y a la comunidad.","correcta":true,"feedback":"Correcto. La generatividad no depende de la maternidad o la paternidad; también se construye mediante mentoría, creación y compromiso social."},{"id":"B","texto":"No puede ser generativo porque solo la descendencia biológica permite dejar un legado.","correcta":false,"feedback":"No. Esa idea reduce un concepto amplio a una sola experiencia y excluye injustificadamente otras contribuciones adultas."},{"id":"C","texto":"Solo sería generativo si recibiera pago por orientar a los aprendices.","correcta":false,"feedback":"No. Una actividad remunerada puede ser generativa, pero el pago no es el criterio central; importa su orientación al cuidado, la transmisión y el bien común."}],"concepto":"Pluralidad de expresiones generativas","explicacion":"La generatividad puede ser procreativa, productiva, creativa o comunitaria. Su núcleo es proyectar un aporte que trascienda el beneficio exclusivamente individual.","fuentes":["S08"],"cita_corta":"(Moreno et al., 2022)"},{"id":"MC09","tipo":"mito_realidad","titulo":"¿El bienestar toca fondo?","pregunta":"Afirmación: «La satisfacción con la vida necesariamente alcanza su punto más bajo durante la mediana edad». ¿Cómo se clasifica?","opciones":[{"id":"A","texto":"Mito","correcta":true,"feedback":"Correcto. Algunos estudios transversales muestran una curva en U, pero investigaciones longitudinales encuentran patrones estables o positivos; no existe una trayectoria obligatoria para todas las personas."},{"id":"B","texto":"Realidad universal","correcta":false,"feedback":"No. Las conclusiones dependen del diseño, la muestra y el contexto, y las diferencias individuales impiden presentar un único patrón como universal."},{"id":"C","texto":"Realidad exclusivamente por cambios hormonales","correcta":false,"feedback":"No. El bienestar no se explica por un solo factor biológico; intervienen salud, relaciones, economía, trabajo, cultura y acontecimientos vitales."}],"concepto":"Heterogeneidad del bienestar en la mediana edad","explicacion":"La evidencia sobre una curva en U no es uniforme. Los diseños longitudinales y transversales pueden producir resultados diferentes, por lo que no se debe convertir una tendencia estadística en destino individual.","fuentes":["S05","S06"],"cita_corta":"(Infurna et al., 2020; Lachman et al., 2015)"},{"id":"MC10","tipo":"decision_escenario","titulo":"Cuidar entre generaciones sin quedar solo","pregunta":"Escenario educativo ficticio: Rosa, de 48 años, apoya económicamente a una hija universitaria y coordina el cuidado de su madre. Empieza a sentirse sobrecargada. ¿Qué respuesta es más adecuada?","opciones":[{"id":"A","texto":"Reconocer la sobrecarga, distribuir responsabilidades, activar redes de apoyo y establecer límites realistas.","correcta":true,"feedback":"Correcto. La posición entre generaciones puede concentrar demandas; compartir tareas y pedir apoyo protege el bienestar sin negar los vínculos de cuidado."},{"id":"B","texto":"Asumir todas las tareas en silencio porque pedir ayuda significa no querer a la familia.","correcta":false,"feedback":"No. El afecto no exige sostener una carga ilimitada; organizar apoyos puede mejorar la continuidad y calidad del cuidado."},{"id":"C","texto":"Concluir que la sobrecarga demuestra una crisis inevitable y que nada puede modificarse.","correcta":false,"feedback":"No. La carga de roles puede ser real, pero existen recursos personales, familiares, comunitarios e institucionales que pueden reorganizar la situación."}],"concepto":"Roles intergeneracionales, apoyo y límites","explicacion":"Las personas de mediana edad suelen conectar generaciones y enfrentar responsabilidades simultáneas. El contexto social y las redes disponibles influyen en cómo se vive esa posición.","fuentes":["S05","S06"],"cita_corta":"(Infurna et al., 2020; Lachman et al., 2015)"},{"id":"MC11","tipo":"mito_realidad","titulo":"Una etiqueta no sustituye una valoración","pregunta":"Afirmación: «Si el malestar aparece en la mediana edad, debe explicarse como crisis y no hace falta evaluar depresión, ansiedad, duelo, enfermedad o sobrecarga». ¿Cómo se clasifica?","opciones":[{"id":"A","texto":"Mito","correcta":true,"feedback":"Correcto. Atribuir todo a una crisis puede retrasar la identificación de problemas de salud o situaciones sociales que requieren apoyo específico."},{"id":"B","texto":"Realidad","correcta":false,"feedback":"No. El malestar persistente o que afecta el funcionamiento merece una valoración de sus posibles causas, sin asumir que la edad lo explica todo."},{"id":"C","texto":"Realidad si la persona tiene responsabilidades familiares","correcta":false,"feedback":"Tampoco. Las responsabilidades pueden influir, pero no descartan otras causas ni reemplazan una valoración cuando el malestar es intenso o persistente."}],"concepto":"Diferenciación entre narrativa cultural y problema de salud","explicacion":"La idea de una crisis normativa puede hacer que síntomas físicos o psicológicos se normalicen indebidamente. La atención debe considerar duración, intensidad, funcionamiento y contexto.","fuentes":["S05"],"cita_corta":"(Infurna et al., 2020)"},{"id":"MC12","tipo":"seleccion_simple","titulo":"Una lectura integradora","pregunta":"¿Cuál conclusión resume mejor una comprensión rigurosa de la llamada crisis de la mediana edad?","opciones":[{"id":"A","texto":"Puede existir en algunas trayectorias, pero no es universal; debe comprenderse según pérdidas, recursos, vínculos, salud, cultura y condiciones de vida.","correcta":true,"feedback":"Correcto. Esta formulación reconoce una posibilidad real sin convertirla en destino y permite distinguir tensiones, oportunidades y necesidades de apoyo."},{"id":"B","texto":"Es una enfermedad causada únicamente por el envejecimiento biológico.","correcta":false,"feedback":"No. La crisis de la mediana edad no es un diagnóstico médico universal ni puede explicarse solo por cambios biológicos."},{"id":"C","texto":"Es una invención sin utilidad y ninguna persona puede experimentar una crisis en esta etapa.","correcta":false,"feedback":"No. Rechazar su universalidad no significa negar que algunas personas atraviesen malestar o crisis; lo adecuado es analizar cada experiencia y sus condiciones."}],"concepto":"Comprensión contextual, no determinista","explicacion":"La evidencia empírica cuestiona la crisis como norma, mientras que la lectura psicoanalítica permite pensar ciertos momentos críticos como obstáculo y posibilidad. Ambas perspectivas pueden integrarse si se evita generalizar.","fuentes":["S05","S06","S07","S08"],"cita_corta":"(Infurna et al., 2020; Lachman et al., 2015; Moreno et al., 2022; Saavedra et al., 2022)"}]}],"fuentes":[{"id":"S01","referencia_apa":"World Health Organization. (s. f.). Sexual health. https://www.who.int/health-topics/sexual-health","url":"https://www.who.int/health-topics/sexual-health","doi":null},{"id":"S02","referencia_apa":"National Institute on Aging. (s. f.). Sexuality and intimacy in older adults. U.S. Department of Health and Human Services. https://www.nia.nih.gov/health/sexuality/sexuality-and-intimacy-older-adults","url":"https://www.nia.nih.gov/health/sexuality/sexuality-and-intimacy-older-adults","doi":null},{"id":"S03","referencia_apa":"World Health Organization. (2024, 16 de octubre). Menopause. https://www.who.int/news-room/fact-sheets/detail/menopause/","url":"https://www.who.int/news-room/fact-sheets/detail/menopause/","doi":null},{"id":"S04","referencia_apa":"World Health Organization. (2020). WHO guidelines on physical activity and sedentary behaviour. https://www.who.int/publications/i/item/9789240015128","url":"https://www.who.int/publications/i/item/9789240015128","doi":null},{"id":"S05","referencia_apa":"Infurna, F. J., Gerstorf, D., & Lachman, M. E. (2020). Midlife in the 2020s: Opportunities and challenges. American Psychologist, 75(4), 470–485. https://doi.org/10.1037/amp0000591","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7347230/","doi":"https://doi.org/10.1037/amp0000591"},{"id":"S06","referencia_apa":"Lachman, M. E., Teshale, S., & Agrigoroaei, S. (2015). Midlife as a pivotal period in the life course: Balancing growth and decline at the crossroads of youth and old age. International Journal of Behavioral Development, 39(1), 20–31. https://doi.org/10.1177/0165025414533223","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4286887/","doi":"https://doi.org/10.1177/0165025414533223"},{"id":"S07","referencia_apa":"Saavedra, M. E., Ojeda, R. A., & Aguzzi, S. D. (2022). Una lectura de la mediana edad desde la perspectiva psicoanalítica. En Memorias del XIV Congreso Internacional de Investigación y Práctica Profesional en Psicología (pp. 731–734). Facultad de Psicología, Universidad de Buenos Aires. https://www.aacademica.org/000-084/541","url":"https://www.aacademica.org/000-084/541","doi":null},{"id":"S08","referencia_apa":"Moreno, J. E., Hess, C. D., Schönfeld, F. S., & Rodriguez, L. M. (2022). Generatividad: Noción clave para la comprensión de la vida adulta y la vejez (Serie Cuadernos de Psicología y Psicopedagogía, N.º 9). Universidad Católica Argentina. https://ri.conicet.gov.ar/handle/11336/188545","url":"https://ri.conicet.gov.ar/handle/11336/188545","doi":null},{"id":"S09","referencia_apa":"Amezcua, T., & García Domingo, M. (2022). «¿Mayor, yo? ¿Dónde lo pone?» Concepción y atribuciones sociales a la vejez según la autopercepción de las personas mayores del siglo XXI: de la seneficiencia al elder pride. Recerca. Revista de Pensament i Anàlisi, 27(1), 1–26. https://doi.org/10.6035/recerca.5778","url":"https://www.e-revistes.uji.es/index.php/recerca/article/download/5778/6893","doi":"https://doi.org/10.6035/recerca.5778"},{"id":"S10","referencia_apa":"Carabalí C., S. M. (2020). Vejez y teorías del envejecimiento. En E. Gómez Ramírez & A. P. Calvo Soto (Eds. científicas), Salud, vejez y discapacidad (pp. 25–50). Editorial Universidad Santiago de Cali. https://doi.org/10.35985/9789585147416.1","url":"https://libros.usc.edu.co/index.php/usc/es/catalog/book/351/chapter/1707","doi":"https://doi.org/10.35985/9789585147416.1"}]}</script><script>
'use strict';const CONTENT=JSON.parse(document.getElementById('content-data').textContent);const FIXED='fisico_sexual';const APP=document.getElementById('app');let game=null,index=0,answers=[],arranged=[],started=false;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(n,color='#235a4c')=>{const paths=[`<path d="M20 7c-8-10-24 3-15 14L20 36 35 21C44 10 28-3 20 7Z"/>`,`<circle cx="20" cy="20" r="17"/><path d="m25 12-4 13-9 3 4-13Z"/>`,`<path d="m20 3 5 10 11 2-8 8 2 12-10-6-10 6 2-12-8-8 11-2Z"/>`];return `<svg viewBox="0 0 40 40" fill="none" stroke="${color}" stroke-width="2" aria-hidden="true">${paths[n%3]}</svg>`};
const scene=()=>`<svg class="scene" viewBox="0 0 600 510" role="img" aria-label="Ilustración de personas adultas que recorren caminos distintos entre naturaleza, vínculos y proyectos"><defs><linearGradient id="sky" x2="1" y2="1"><stop stop-color="#e4eadc"/><stop offset="1" stop-color="#c7d9c7"/></linearGradient></defs><rect x="22" y="20" width="556" height="445" rx="190" fill="url(#sky)"/><circle cx="455" cy="105" r="51" fill="#e5bf7b"/><path d="M24 400C100 295 220 355 292 299S488 255 582 355V464H24Z" fill="#a3bfa3"/><path d="M40 464c45-72 121-81 183-42s154 36 214-16 100-36 140-15" fill="none" stroke="#f6f2e9" stroke-width="33"/><path d="M92 354V211m0 75c-51-7-54-50-48-67 42 3 55 28 48 67m0-19c52-12 59-54 50-74-42 3-57 38-50 74" fill="#6f956d" stroke="#6f956d" stroke-width="5"/><path d="M514 378V249m0 68c-37-4-45-41-39-62 38 4 49 29 39 62m0-20c42-10 50-46 42-61-34 5-46 32-42 61" fill="#386954" stroke="#386954" stroke-width="4"/><path d="M205 358v-99c0-45 68-45 68 0v99" fill="#f1e0c0"/><path d="M224 304h31v54h-31Z" fill="#bc7559"/><circle cx="239" cy="236" r="19" fill="#9b5e46"/><path d="M219 233c-1-27 37-27 40 2-11-3-17-11-18-15-5 10-12 13-22 13" fill="#253f3d"/><path d="m226 349-5 50m29-50 9 51" stroke="#334b44" stroke-width="13" stroke-linecap="round"/><path d="m223 285-26 43m61-42 20 35" fill="none" stroke="#9b5e46" stroke-width="10" stroke-linecap="round"/><circle cx="364" cy="226" r="18" fill="#ce9c75"/><path d="M343 224c-6-31 43-29 41 4l-9-12-25 1Z" fill="#e8e3cf"/><path d="M341 260c9-16 37-18 46 1l11 69h-63Z" fill="#335e52"/><path d="m346 327-5 60m42-60 9 58" stroke="#785c45" stroke-width="12" stroke-linecap="round"/><path d="m342 265-28 52m68-49 25 40" fill="none" stroke="#ce9c75" stroke-width="9" stroke-linecap="round"/><path d="m420 314-2 75" stroke="#8c6f4b" stroke-width="5" stroke-linecap="round"/><path d="M305 124c-28 7-33 29-20 48 25-3 34-20 20-48Z" fill="#235a4c"/><path d="M312 146c29-9 47 8 44 29-28 9-46-4-44-29Z" fill="#729e7e"/><path d="M305 142v46" stroke="#235a4c" stroke-width="3"/><circle cx="159" cy="116" r="3" fill="#b8583c"/><circle cx="170" cy="136" r="3" fill="#b8583c"/><path d="m42 107 12-9 12 9m356 64 12-9 12 9" stroke="#517768" stroke-width="3" fill="none"/><circle cx="190" cy="431" r="7" fill="#b8583c"/><circle cx="458" cy="413" r="7" fill="#235a4c"/><path d="M188 431c110-50 160 50 271-18" stroke="#6f8c70" stroke-dasharray="4 9" fill="none"/></svg>`;
const routeArt=n=>`<svg viewBox="0 0 140 210" role="img" aria-label="${n===0?'Corazón y cuidados a lo largo de un camino':'Brújula con distintas posibilidades de recorrido'}"><path d="M20 192C115 150 12 114 98 63" stroke="#b9cdb5" stroke-width="15" fill="none"/><circle cx="47" cy="171" r="5" fill="#b8583c"/><circle cx="57" cy="129" r="5" fill="#235a4c"/><circle cx="60" cy="91" r="5" fill="#b8583c"/>${n===0?'<path d="M76 31c-17-26-53-2-35 23l35 32 35-32c18-25-18-49-35-23Z" fill="#b8583c"/><path d="m48 52 14 0 9-14 9 28 8-14h17" fill="none" stroke="#fff4dc" stroke-width="3"/>':'<circle cx="77" cy="51" r="36" fill="#235a4c"/><circle cx="77" cy="51" r="29" fill="none" stroke="#e5d1a6"/><path d="m89 28-7 29-17 17 6-30Z" fill="#e5d1a6"/><circle cx="77" cy="51" r="3" fill="#b8583c"/>'}</svg>`;
function home(){game=null;started=false;document.title='Rutas de la adultez';APP.innerHTML=`<section class="hero"><div><span class="eyebrow">Tarea 4 · Caminando desde la adultez hacia la vejez</span><h1>La adultez tiene<br>muchos caminos.</h1><p>Recorre dos juegos de decisiones, descubre qué hay detrás de los mitos y aprende a mirar los cambios de cada persona con más cuidado.</p><p class="author"><strong>Dayan Estefani Herreno Agudelo</strong><br>Psicología y curso de vida · Universidad Nacional Abierta y a Distancia</p></div><div class="hero-visual">${scene()}<div class="scene-label">Cambios, vínculos y nuevas posibilidades</div></div></section><div class="intro-strip"><span>2 juegos independientes</span><span>12 retos por recorrido</span><span>Explicaciones con fuentes académicas</span><span>Sin límite de tiempo</span></div><section class="routes" aria-label="Elige un recorrido">${CONTENT.juegos.map((g,n)=>`<article class="route"><div class="route-content"><span class="eyebrow">Recorrido ${String(n+1).padStart(2,'0')}</span><h3>${n===0?'Decisiones que cuidan':'La brújula de la mediana edad'}</h3><p>${n===0?'Desarrollo físico y sexual en la adultez. Cuerpo, intimidad y bienestar sin estereotipos.':'Crisis de la edad media. Cambios, pérdidas y proyectos sin etiquetas inevitables.'}</p><button class="primary" data-pick="${g.id}">Explorar el juego <span aria-hidden="true">↗</span></button></div><div class="route-visual">${routeArt(n)}</div></article>`).join('')}</section><p class="bottom-note">Los retos incluyen situaciones educativas ficticias. La información orienta el aprendizaje y no sustituye una valoración individual en salud.</p>`;APP.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick));}
function pick(id,change=true){game=CONTENT.juegos.find(g=>g.id===id)||CONTENT.juegos[0];index=0;answers=[];started=false;arranged=game.retos.map(q=>{const a=[...q.opciones];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;});if(change)history.replaceState(null,'','#'+game.id);document.title=(game.id==='fisico_sexual'?'Decisiones que cuidan':'La brújula de la mediana edad')+' · Dayan Estefani Herreno Agudelo';intro();}
const backButton=()=>`<button class="small-button" id="back-home">${FIXED?'Ver el inicio':'← Ver los recorridos'}</button>`;
function wireBack(){document.getElementById('back-home').onclick=()=>{if(FIXED){pick(FIXED);}else{history.replaceState(null,'',location.pathname);home();}window.scrollTo({top:0,behavior:'auto'});};}
function intro(){const n=game.id==='fisico_sexual'?0:1;APP.innerHTML=`<div class="game-shell"><div class="game-top"><span class="eyebrow">Recorrido ${n+1} · Juego educativo</span>${backButton()}</div><section class="start"><div><span class="eyebrow">12 decisiones · 120 puntos posibles</span><h2>${esc(game.titulo)}</h2><p>${esc(game.narrativa.inicio)}</p><ol><li>Lee la situación y elige una de las tres respuestas.</li><li>Revisa la explicación, incluso si acertaste.</li><li>Avanza a tu ritmo. Cada acierto en el primer intento suma 10 puntos.</li></ol><button class="primary" id="start-game">Comenzar recorrido <span aria-hidden="true">→</span></button><p class="tiny">Personajes y situaciones ficticios con propósito educativo. No se registran datos personales.</p></div><div class="start-art">${routeArt(n)}</div></section></div>`;wireBack();document.getElementById('start-game').onclick=()=>{started=true;question();window.scrollTo({top:0,behavior:'auto'});};}
function points(){return answers.reduce((s,a,i)=>s+(a&&game.retos[i].opciones.find(o=>o.id===a)?.correcta?10:0),0);}
function sidebar(){let done=answers.filter(Boolean).length;return `<aside class="sidebar" aria-label="Avance del recorrido"><div><div class="score-block"><span class="eyebrow">Tu puntuación</span><div class="score" aria-live="polite">${points()} <small>/ 120</small></div></div><div class="progress-track" role="progressbar" aria-label="Retos respondidos" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${done}"><div class="progress-fill" style="width:${done/12*100}%"></div></div><p class="progress-text">${done} de 12 retos respondidos</p></div><div><p class="path-label">Tu recorrido</p><nav class="nodes" aria-label="Estaciones del juego">${game.retos.map((q,i)=>{let done=!!answers[i],ok=done&&q.opciones.find(o=>o.id===answers[i]).correcta;return `<button class="node ${i===index?'active':''} ${done?(ok?'done':'wrong'):''}" data-node="${i}" ${(!done&&i!==index)?'disabled':''} aria-label="Reto ${i+1}${done?', respondido':''}${i===index?', actual':''}" ${i===index?'aria-current="step"':''}>${done&&ok?'✓':String(i+1).padStart(2,'0')}</button>`;}).join('')}</nav></div><div class="badge-list">${['Observar','Comprender','Decidir'].map((s,i)=>`<div class="badge ${done>=(i+1)*4?'earned':''}">${icon(i)}<span>${s}</span></div>`).join('')}</div></aside>`;}
function question(){const q=game.retos[index],chosen=answers[index],choice=q.opciones.find(o=>o.id===chosen),kind={seleccion_simple:'Idea clave',mito_realidad:'Mito o realidad',decision_escenario:'Una decisión cotidiana'}[q.tipo];APP.innerHTML=`<div class="game-shell"><div class="game-top"><span class="eyebrow">${game.id==='fisico_sexual'?'Cuerpo, intimidad y bienestar':'Cambios, vínculos y proyectos'}</span>${backButton()}</div><h1 class="game-title">${esc(game.titulo)}</h1><div class="game-grid">${sidebar()}<section class="question-card" aria-label="Reto actual"><div class="question-meta"><span class="type">${kind}</span><span class="tiny">RETO ${String(index+1).padStart(2,'0')} / 12</span></div><h2 id="question-title" tabindex="-1">${esc(q.titulo)}</h2><p class="question">${esc(q.pregunta)}</p><div class="answers" aria-label="Respuestas">${arranged[index].map((o,i)=>`<button class="answer ${chosen?(o.id===chosen?(o.correcta?'correct':'incorrect'):(o.correcta?'correct':'')):''}" data-answer="${o.id}" ${chosen?'disabled':''}><span class="letter" aria-hidden="true">${'ABC'[i]}</span><span>${esc(o.texto)}</span></button>`).join('')}</div>${chosen?`<div class="feedback ${choice.correcta?'':'no'}" role="status"><strong>${choice.correcta?'Una decisión bien fundamentada. +10 puntos':'Este reto deja una idea para revisar.'}</strong>${esc(choice.feedback)}<p style="margin-top:9px">${esc(q.explicacion)}</p><span class="cite">${esc(q.cita_corta)}</span></div>`:'<p class="tiny" style="margin-top:18px">Elige una respuesta para ver la explicación y continuar.</p>'}<div class="question-bottom"><small>${esc(q.concepto)}</small><button class="primary" id="next-question" ${!chosen?'disabled':''}>${index===11?'Ver mi recorrido':'Siguiente reto'} <span aria-hidden="true">→</span></button></div></section></div></div>`;wireBack();APP.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answers[index])return;answers[index]=b.dataset.answer;question();document.querySelector('.feedback')?.scrollIntoView({behavior:'auto',block:'nearest'});});APP.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.node);question();document.getElementById('question-title').focus({preventScroll:true});});document.getElementById('next-question').onclick=()=>{if(!answers[index])return;if(index===11){if(answers.filter(Boolean).length===12)results();else{index=answers.findIndex(x=>!x);question();}}else{index++;question();}window.scrollTo({top:0,behavior:'auto'});};}
function results(){let hits=points()/10;APP.innerHTML=`<div class="game-shell"><div class="game-top"><span class="eyebrow">Tu recorrido está completo</span>${backButton()}</div><section class="results"><div><span class="eyebrow">${esc(game.titulo)}</span><h1 class="game-title">Cada respuesta abre<br>otra forma de mirar.</h1><div class="large">${points()}<span style="font:20px Arial,sans-serif;color:var(--muted)"> / 120</span></div><p><strong>${hits} aciertos de 12 retos.</strong> Completaste este recorrido. Revisa las explicaciones para afianzar lo aprendido.</p><p>${esc(game.narrativa.cierre)}</p><div class="result-actions"><button class="primary" id="review-all">Revisar mis respuestas ↓</button><button class="secondary" id="restart-game">Volver a jugar</button></div></div><div class="results-art">${routeArt(game.id==='fisico_sexual'?0:1)}<div class="insights"><div class="insight">12 situaciones exploradas</div><div class="insight">Información para decidir con criterio</div></div></div></section><section class="review hidden" id="review" aria-label="Revisión de respuestas">${game.retos.map((q,i)=>{const selected=q.opciones.find(o=>o.id===answers[i]),right=q.opciones.find(o=>o.correcta);return `<details><summary>${String(i+1).padStart(2,'0')} · ${esc(q.titulo)} · ${selected.correcta?'Acierto':'Para revisar'}</summary><p><strong>Tu elección:</strong> ${esc(selected.texto)}</p>${!selected.correcta?`<p><strong>Respuesta fundamentada:</strong> ${esc(right.texto)}</p>`:''}<p>${esc(q.explicacion)}</p><p class="citation">${esc(q.cita_corta)}</p></details>`;}).join('')}</section></div>`;wireBack();document.getElementById('restart-game').onclick=()=>{let id=game.id;pick(id);};document.getElementById('review-all').onclick=()=>{document.getElementById('review').classList.remove('hidden');document.getElementById('review').scrollIntoView({behavior:'auto'});};}
const dialog=document.getElementById('sources');document.getElementById('source-list').innerHTML=CONTENT.fuentes.map(f=>`<li>${esc(f.referencia_apa)}</li>`).join('');document.getElementById('show-sources').onclick=()=>dialog.showModal();document.getElementById('close-sources').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});let initial=FIXED||decodeURIComponent(location.hash.slice(1));if(CONTENT.juegos.some(g=>g.id===initial))pick(initial,false);else home();
window.addEventListener('hashchange',()=>{const target=FIXED||decodeURIComponent(location.hash.slice(1));if(CONTENT.juegos.some(g=>g.id===target))pick(target,false);else home();});
</script></body></html>
